<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeno Chatbot</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <circle cx="14" cy="14" r="14" fill="#7C3AED"/>
            <path d="M8 14.5C8 11.5 10.5 9 14 9s6 2.5 6 5.5-2.5 5.5-6 5.5c-1 0-1.9-.2-2.7-.6L8 20.5l1.2-3.2C8.4 16.4 8 15.5 8 14.5z" fill="white"/>
          </svg>
          <span>Zeno Chatbot</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn" title="New chat">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="sidebar-section-label">Recent</div>
      <div class="history-list" id="historyList"></div>
      <div class="sidebar-footer">
        <div class="model-badge">llama-3.3-70b</div>
      </div>
    </aside>

    <main class="chat-area">
      <div class="messages-container" id="messagesContainer">
        <div class="welcome" id="welcomeScreen">
          <div class="welcome-icon">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
              <circle cx="20" cy="20" r="20" fill="#7C3AED"/>
              <path d="M11 20.5C11 16.4 15 13 20 13s9 3.4 9 7.5-4 7.5-9 7.5c-1.4 0-2.7-.3-3.9-.8L11 29l1.7-4.5C12 23.2 11 21.9 11 20.5z" fill="white"/>
            </svg>
          </div>
          <h1>How can I help you today?</h1>
          <p>Ask me anything — I'm powered by groq.</p>
          <div class="suggestions">
            <button class="suggestion-chip" onclick="useSuggestion(this)">Explain quantum computing simply</button>
            <button class="suggestion-chip" onclick="useSuggestion(this)">Write a short poem about the ocean</button>
            <button class="suggestion-chip" onclick="useSuggestion(this)">Help me debug my JavaScript</button>
            <button class="suggestion-chip" onclick="useSuggestion(this)">What's the best way to learn a language?</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="userInput"
            placeholder="Message Zeno..."
            rows="1"
            onkeydown="handleKeyDown(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2 8l12-6-5 6 5 6-12-6z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <p class="disclaimer">Zeno can make mistakes. Consider checking important information.</p>
      </div>
    </main>
  </div>

  <script src="js/marked.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
